# Prometheus Konfiguration fuer Supabase

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'supabase'

# Alertmanager Konfiguration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Regel-Dateien
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus selbst
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL Metriken
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'supabase-db'

  # Node Exporter - System Metriken
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container Metriken
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Traefik Metriken
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # Kong Metriken (falls aktiviert)
  # - job_name: 'kong'
  #   static_configs:
  #     - targets: ['kong:8001']

  # GoTrue/Auth Metriken (falls verfuegbar)
  # - job_name: 'auth'
  #   static_configs:
  #     - targets: ['auth:9999']
  #   metrics_path: /metrics
